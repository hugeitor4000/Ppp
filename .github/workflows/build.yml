name: Build immortal-zombie

on:
  push:
    branches: ["main"]
  workflow_dispatch:  # también permite lanzarlo a mano desde la app

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Update repos
        run: xmake repo -u

      - name: Configure
        run: xmake f -m release

      - name: Build
        run: xmake

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortal-zombie-dll
          path: bin/windows/x64/release/immortal-zombie/
